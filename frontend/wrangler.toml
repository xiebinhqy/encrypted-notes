name = "encrypted-notes-frontend"
compatibility_date = "2024-04-01"

[assets]
directory = "public"
binding = "ASSETS"

[env.preview]
name = "encrypted-notes-preview-frontend"

[env.staging]
name = "encrypted-notes-staging-frontend"

[env.production]
name = "encrypted-notes-production-frontend"