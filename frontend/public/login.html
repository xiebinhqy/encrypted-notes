<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加密笔记 - 安全登录</title>
    
    <!-- 外部资源 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind配置 -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        secondary: '#8b5cf6',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        dark: {
                            DEFAULT: '#0f172a',
                            light: '#1e293b',
                            lighter: '#334155',
                        },
                        light: {
                            DEFAULT: '#f8fafc',
                            dark: '#cbd5e1',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- 样式文件 -->
    <link rel="stylesheet" href="/css/core/base.css">
    <link rel="stylesheet" href="/css/core/theme.css">
    <link rel="stylesheet" href="/css/components/common.css">
    <link rel="stylesheet" href="/css/pages/login.css">
    
    <style>
        .gradient-bg { 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%); 
        }
        .glass-effect {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="font-sans antialiased gradient-bg min-h-screen">
    <!-- 登录页面容器 -->
    <div id="login-app">
        <!-- 登录页面内容将由JavaScript动态渲染 -->
        <div class="loading-container">
            <div class="loading-spinner">
                <i class="fas fa-lock animate-spin text-4xl text-indigo-400"></i>
                <p class="mt-4 text-gray-400">加载登录页面...</p>
            </div>
        </div>
    </div>
    
    <!-- 登录页面入口 -->
    <script type="module" src="/js/pages/LoginPage.js"></script>
</body>
</html>
