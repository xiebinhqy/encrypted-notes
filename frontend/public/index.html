<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的加密笔记 - 安全的私人笔记应用</title>
    
    <!-- ==================== CSS样式引用 ==================== -->
    <!-- 注意：以下样式文件需要按顺序加载 -->
    
    <!-- 1. 字体图标库 (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 2. 谷歌字体 (可选，用于更好的字体显示) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- 3. 核心CSS变量定义 (必须第一个加载) -->
    <link rel="stylesheet" href="/css/variables.css">
    
    <!-- 4. 通用组件样式 -->
    <link rel="stylesheet" href="/css/components/Common/footer.css">
    
    <!-- 5. 表单组件样式 -->
    <link rel="stylesheet" href="/css/components/Forms/forms.css">
    
    <!-- 6. 页面组件样式 -->
    <link rel="stylesheet" href="/css/components/Pages/settings.css">
    <link rel="stylesheet" href="/css/components/Pages/notes.css">
    
    <!-- 7. 未来扩展：在此处添加新的CSS文件 -->
    <!-- 示例：<link rel="stylesheet" href="/css/components/扩展目录/新组件.css"> -->
    
    <!-- 网站图标 -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    
    <!-- PWA支持 (未来扩展) -->
    <!-- <link rel="manifest" href="/manifest.json"> -->
    <meta name="theme-color" content="#6366f1">
    <meta name="description" content="安全的私人加密笔记应用，保护您的每一段思考">
    
    <!-- 移动端优化 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <!-- ==================== 应用主容器 ==================== -->
    <!-- 所有组件将挂载到这些容器中 -->
    
    <!-- 应用根容器 -->
    <div id="app">
        <!-- 顶部导航栏容器 -->
        <!-- Header组件将渲染到这里 -->
        <div id="app-header"></div>
        
        <!-- 侧边栏容器 -->
        <!-- Sidebar组件将渲染到这里 -->
        <div id="app-sidebar"></div>
        
        <!-- 主内容区域容器 -->
        <!-- 页面组件（NotesPage, SettingsPage等）将渲染到这里 -->
        <div id="app-content"></div>
        
        <!-- 页脚容器 -->
        <!-- Footer组件将渲染到这里 -->
        <div id="app-footer"></div>
    </div>
    
    <!-- ==================== 全局挂载点 ==================== -->
    <!-- 这些容器用于全局组件，如模态框、通知等 -->
    
    <!-- 模态框挂载点 -->
    <!-- BaseModal及其子类将渲染到这里 -->
    <div id="modal-root"></div>
    
    <!-- 通知挂载点 -->
    <!-- Notification组件将渲染到这里 -->
    <div id="notification-root"></div>
    
    <!-- 加载中挂载点 -->
    <!-- Loading组件将渲染到这里 -->
    <div id="loading-root"></div>
    
    <!-- 错误边界挂载点 -->
    <!-- ErrorBoundary组件将渲染到这里 -->
    <div id="error-boundary-root"></div>
    
    <!-- ==================== JavaScript引用 ==================== -->
    <!-- 注意：以下脚本需要按顺序加载 -->
    
    <!-- 1. 核心工具库 (模拟版本，未来可替换为真实实现) -->
    <script src="/js/core/utils.js"></script>
    <script src="/js/core/config.js"></script>
    <script src="/js/core/offline.js"></script>
    
    <!-- 2. API接口库 (模拟版本，未来可替换为真实后端API) -->
    <script src="/js/api/index.js"></script>
    
    <!-- 3. 应用主入口 (ES6模块) -->
    <script type="module" src="/js/app.js"></script>
    
    <!-- 4. 未来扩展：在此处添加新的JS文件 -->
    <!-- 示例：<script type="module" src="/js/components/扩展目录/新组件.js"></script> -->
    
    <!-- 5. 第三方库 (按需添加) -->
    <!--
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js/lib/highlight.min.js"></script>
    -->
    
    <!-- 内联脚本：初始加载样式 -->
    <script>
        // 防止页面加载时的样式闪烁
        document.addEventListener('DOMContentLoaded', function() {
            // 添加加载完成类
            document.body.classList.add('loaded');
            
            // 设置初始主题
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.className = savedTheme;
        });
        
        // 显示加载状态
        document.write(`
            <style>
                /* 初始加载样式 */
                body:not(.loaded) #app {
                    opacity: 0;
                }
                
                /* 加载指示器 */
                .app-loading {
                    position: fixed;
                    top: 0;
                    left: 0;
                    right: 0;
                    bottom: 0;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    background: var(--bg-primary);
                    z-index: 9999;
                    transition: opacity 0.3s ease;
                }
                
                .app-loading.hidden {
                    opacity: 0;
                    pointer-events: none;
                }
                
                .loading-spinner {
                    width: 50px;
                    height: 50px;
                    border: 3px solid var(--border-color);
                    border-top-color: var(--primary-color);
                    border-radius: 50%;
                    animation: spin 1s linear infinite;
                    margin-bottom: 1rem;
                }
                
                .loading-text {
                    color: var(--text-secondary);
                    font-size: 0.875rem;
                }
                
                @keyframes spin {
                    to { transform: rotate(360deg); }
                }
            </style>
            
            <div class="app-loading" id="app-loading">
                <div class="loading-spinner"></div>
                <div class="loading-text">加载应用中...</div>
            </div>
        `);
    </script>
</body>
</html>
