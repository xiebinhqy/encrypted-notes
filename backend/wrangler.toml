# ==============================================
# 定时任务配置（高可用核心）
# ==============================================
[triggers]
crons = [
  # 每5分钟同步KV临时备份到备用D1
  { cron = "*/5 * * * *", binding = "SYNC_BACKUP" },
  # 每天凌晨3点全量备份主数据库到KV
  { cron = "0 3 * * *", binding = "FULL_BACKUP" }
]