# ==============================================
# 加密笔记后端 wrangler 完整配置
# 三环境完全隔离：生产环境(线上) + 测试环境(线上) + 本地环境(本地)
# 版本：v2.1.1 - 本地单端口8787修复版
# 兼容：Wrangler 4.92.0
# 纯原生Cloudflare Worker，无任何框架依赖
# ==============================================
name = "encrypted-notes-backend"
main = "src/index.js"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

# ==============================================
# 本地开发配置（核心修改：固定端口8787）
# ==============================================
[dev]
port = 8787
local_protocol = "http"
inspect = true

# ==============================================
# 静态资源服务配置（前端由后端统一提供，彻底解决跨域）
# ==============================================
[assets]
directory = "../frontend/public"
binding = "ASSETS"

# ==============================================
# 全局变量配置
# ==============================================
[vars]
ALLOW_PUBLIC_REGISTRATION = "true"
PBKDF2_ITERATIONS = "100000"

# ==============================================
# 本地环境配置
# ==============================================
[env.preview]
name = "encrypted-notes-preview-backend"
[env.preview.vars]
ENVIRONMENT = "preview"
ADMIN_EMAIL = "deattorxb@gmail.com"
ALLOW_PUBLIC_REGISTRATION = "true"
JWT_SECRET = "df4bbaee49566ddb81ed8863564afef04b2fc9ab4c5e18adce1e02445c6bce55f7f05ef31e62c89ee55ad37f18f9e0f2eb4e71e8b2a02efc68614eb33a939c78"
PBKDF2_ITERATIONS = "100000"
TURNSTILE_SECRET_KEY = "0x4AAAAAAADG-mG-YfUq8IAKOff7V3YmJAY"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "staging-notes-db"
database_id = "815c893f-b1b3-4f05-b737-c544becdaa0f"

[[env.preview.d1_databases]]
